name: Publish Python Package to Pypi.org

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-publish-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  pypi-publish:
    name: Release Python Package on Pypi.org
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djangorestframework-gis
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          pip install -U pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
