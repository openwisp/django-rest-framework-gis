---
name: Django Rest Framework Gis CI Build

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master
      - "[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python==${{ matrix.env.python }} | ${{ matrix.env.TOXENV }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis@sha256:1e85984a7261b01b38a8e7d4166abcdb35370e6b7667a6d6fd9caa057f64eab6 # 17-3.5-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: django_restframework_gis
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        env:
          # DRF 3.14
          - python: "3.11"
            TOXENV: py311-django42-djangorestframework314-djangofilter235
          # DRF 3.15
          - python: "3.11"
            TOXENV: py311-django50-djangorestframework315
          - python: "3.12"
            TOXENV: py312-django50-djangorestframework315
          - python: "3.13"
            TOXENV: py313-django50-djangorestframework315
          - python: "3.11"
            TOXENV: py311-django51-djangorestframework315
          - python: "3.12"
            TOXENV: py312-django51-djangorestframework315
          - python: "3.13"
            TOXENV: py313-django51-djangorestframework315
          - python: "3.11"
            TOXENV: py311-django52-djangorestframework315
          - python: "3.12"
            TOXENV: py312-django52-djangorestframework315
          - python: "3.13"
            TOXENV: py313-django52-djangorestframework315
          # DRF 3.16
          - python: "3.11"
            TOXENV: py311-django50-djangorestframework316
          - python: "3.12"
            TOXENV: py312-django50-djangorestframework316
          - python: "3.13"
            TOXENV: py313-django50-djangorestframework316
          - python: "3.11"
            TOXENV: py311-django51-djangorestframework316
          - python: "3.12"
            TOXENV: py312-django51-djangorestframework316
          - python: "3.13"
            TOXENV: py313-django51-djangorestframework316
          - python: "3.11"
            TOXENV: py311-django52-djangorestframework316
          - python: "3.12"
            TOXENV: py312-django52-djangorestframework316
          - python: "3.13"
            TOXENV: py313-django52-djangorestframework316
          # DRF 3.17
          - python: "3.11"
            TOXENV: py311-django50-djangorestframework317
          - python: "3.12"
            TOXENV: py312-django50-djangorestframework317
          - python: "3.13"
            TOXENV: py313-django50-djangorestframework317
          - python: "3.11"
            TOXENV: py311-django51-djangorestframework317-djangofilter251
          - python: "3.12"
            TOXENV: py312-django51-djangorestframework317
          - python: "3.13"
            TOXENV: py313-django51-djangorestframework317
          - python: "3.11"
            TOXENV: py311-django52-djangorestframework317
          - python: "3.12"
            TOXENV: py312-django52-djangorestframework317
          - python: "3.13"
            TOXENV: py313-django52-djangorestframework317
          - python: "3.12"
            TOXENV: py312-django60-djangorestframework317
          - python: "3.13"
            TOXENV: py313-django60-djangorestframework317
          # DRF 3.18
          - python: "3.11"
            TOXENV: py311-django52-djangorestframework318
          - python: "3.12"
            TOXENV: py312-django52-djangorestframework318-djangofilter261
          - python: "3.13"
            TOXENV: py313-django52-djangorestframework318
          - python: "3.12"
            TOXENV: py312-django60-djangorestframework318-djangofilter261
          - python: "3.13"
            TOXENV: py313-django60-djangorestframework318
          # Django 6.1
          - python: "3.12"
            TOXENV: py312-django61-djangorestframework318-djangofilter261
          - python: "3.13"
            TOXENV: py313-django61-djangorestframework318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.env.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.env.python }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        id: deps
        run: |
          sudo apt -qq update
          sudo apt -qq -y install binutils libproj-dev gdal-bin
          pip install -U pip wheel setuptools
          pip install -U -r requirements-test.txt
          pip install tox docutils pygments twine

      - name: QA checks
        run: |
          ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          POSTGRES_HOST: localhost
          TOXENV: ${{ matrix.env.TOXENV }}
        run: |
          tox -e "$TOXENV"
          coverage combine
          coverage xml

      - name: Upload Coverage
        if: ${{ success() }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          format: cobertura
          flag-name: python-${{ matrix.env.env }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coveralls:
    name: Finalize Coveralls report
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true
