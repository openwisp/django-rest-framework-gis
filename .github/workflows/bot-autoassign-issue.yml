name: Issue Assignment Bot
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] Comments are the assignment interface; trusted bot code validates requests and issues.
    types: [created]
permissions: {}
concurrency:
  group: bot-autoassign-issue-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  respond-to-assign-request:
    if: github.repository == 'openwisp/django-rest-framework-gis' && github.event.issue.pull_request == null
    permissions:
      contents: read
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-autoassign.yml@61f8fad5c4f6b9b1cf47eb396c2e1c8392aed52f # 0.1.1
    with:
      bot_command: issue_assignment
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
